name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify package manager (npm only)
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "Error: Only npm is allowed. Remove pnpm-lock.yaml or yarn.lock."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --omit=optional --legacy-peer-deps || {
            echo "=== NPM INSTALL FAILED - LOG OUTPUT ==="
            find /home/runner/.npm/_logs -type f -exec cat {} + 2>/dev/null || true
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

