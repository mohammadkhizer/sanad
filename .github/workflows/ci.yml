name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify package manager (npm only)
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "Error: Only npm is allowed. Remove pnpm-lock.yaml or yarn.lock."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --omit=optional || {
            ERR=$(tail -n 40 /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | tr '\n' ' ' | cut -c 1-800)
            echo "::error title=NPM_INSTALL_ERROR::$ERR"
            exit 1
          }

      - name: Build shared workspace
        run: npm --workspace=packages/shared run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test shared package
        run: npm run test --workspace=packages/shared

      - name: Test backend API
        run: npm run test --workspace=apps/api -- --reporter=github --reporter=default

      - name: Test mobile app
        run: npm run test --workspace=apps/mobile

