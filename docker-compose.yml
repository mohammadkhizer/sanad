version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sanad-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: sanad
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: sanad-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
